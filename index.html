<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="URL 또는 텍스트를 고화질 QR 코드로 실시간 변환하고 다운로드할 수 있는 웹 앱입니다.">
  <title>QR Maker - 빠른 고화질 QR 코드 생성기</title>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <div class="badge">
        <span class="badge-dot"></span>
        오프라인 로컬 지원 웹 앱
      </div>
      <h1 class="app-title">QR 코드 생성기</h1>
      <p class="app-subtitle">URL을 입력하면 즉시 스캔 가능한 고해상도 QR 코드를 생성합니다. 색상, 크기 커스텀 및 이미지 다운로드를 지원합니다.</p>
    </header>

    <!-- Main Content -->
    <main class="main-grid">
      <!-- Input & Controls Section -->
      <section class="glass-panel" aria-labelledby="input-heading">
        <div class="tabs-header">
          <button type="button" class="tab-btn active" data-tab="url">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
            링크 / 텍스트
          </button>
          <button type="button" class="tab-btn" data-tab="wifi">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
              <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
              <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
              <line x1="12" y1="20" x2="12.01" y2="20"/>
            </svg>
            와이파이 (Wi-Fi)
          </button>
          <button type="button" class="tab-btn" data-tab="vcard">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            연락처 (vCard)
          </button>
        </div>

        <!-- TAB 1: URL / Text -->
        <div id="tab-content-url" class="tab-pane active">
          <div class="form-group">
            <label for="url-input" class="form-label">링크 주소 또는 텍스트</label>
            <div class="input-container">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="2" y1="12" x2="22" y2="12"/>
                  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
              </span>
              <input 
                type="text" 
                id="url-input" 
                class="text-input" 
                placeholder="예: https://www.google.com" 
                value="https://www.google.com"
                autocomplete="off"
                spellcheck="false"
              />
              <button id="clear-btn" class="clear-btn" title="입력 내용 지우기" aria-label="입력 내용 지우기">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"/>
                  <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>
            </div>

            <!-- Quick test pills -->
            <div class="example-pills">
              <span class="pill-label">빠른 테스트:</span>
              <button class="pill" type="button" data-url="https://www.google.com">Google</button>
              <button class="pill" type="button" data-url="https://www.naver.com">Naver</button>
              <button class="pill" type="button" data-url="https://www.youtube.com">YouTube</button>
              <button class="pill" type="button" data-url="https://github.com">GitHub</button>
            </div>
          </div>
        </div>

        <!-- TAB 2: Wi-Fi -->
        <div id="tab-content-wifi" class="tab-pane">
          <div class="form-group">
            <label for="wifi-ssid" class="form-label">와이파이 이름 (SSID) *</label>
            <input type="text" id="wifi-ssid" class="text-input no-icon" placeholder="와이파이 공유기 이름 입력" value="MyHome_5G">
          </div>
          <div class="form-group">
            <label for="wifi-password" class="form-label">비밀번호</label>
            <input type="text" id="wifi-password" class="text-input no-icon" placeholder="비밀번호 (공개 Wi-Fi면 빈칸)" value="12345678">
          </div>
          <div class="form-row-2">
            <div class="form-group">
              <label for="wifi-encryption" class="form-label">보안 방식</label>
              <select id="wifi-encryption" class="select-input">
                <option value="WPA" selected>WPA/WPA2/WPA3 (권장)</option>
                <option value="WEP">WEP</option>
                <option value="nopass">암호 없음 (개방형)</option>
              </select>
            </div>
            <div class="form-group checkbox-group">
              <label class="checkbox-label" for="wifi-hidden">
                <input type="checkbox" id="wifi-hidden">
                <span>숨김 네트워크 (Hidden SSID)</span>
              </label>
            </div>
          </div>
          <p class="form-help">📱 스마트폰 기본 카메라로 스캔하면 와이파이에 자동 연결됩니다.</p>
        </div>

        <!-- TAB 3: Contact (vCard) -->
        <div id="tab-content-vcard" class="tab-pane">
          <div class="form-row-2">
            <div class="form-group">
              <label for="vcard-name" class="form-label">이름 *</label>
              <input type="text" id="vcard-name" class="text-input no-icon" placeholder="예: 홍길동" value="홍길동">
            </div>
            <div class="form-group">
              <label for="vcard-org" class="form-label">회사 / 직책</label>
              <input type="text" id="vcard-org" class="text-input no-icon" placeholder="예: 마케팅팀 팀장">
            </div>
          </div>
          <div class="form-row-2">
            <div class="form-group">
              <label for="vcard-phone" class="form-label">전화번호</label>
              <input type="tel" id="vcard-phone" class="text-input no-icon" placeholder="예: 010-1234-5678" value="010-1234-5678">
            </div>
            <div class="form-group">
              <label for="vcard-email" class="form-label">이메일</label>
              <input type="email" id="vcard-email" class="text-input no-icon" placeholder="예: contact@example.com">
            </div>
          </div>
          <div class="form-group">
            <label for="vcard-url" class="form-label">홈페이지 / 링크</label>
            <input type="text" id="vcard-url" class="text-input no-icon" placeholder="예: https://mywebsite.com">
          </div>
          <p class="form-help">👤 스마트폰 카메라로 스캔 시 즉시 주소록에 새 연락처로 등록됩니다.</p>
        </div>

        <!-- Customization Controls -->
        <div class="controls-grid">
          <div class="control-item">
            <label for="size-select">해상도 / 크기</label>
            <select id="size-select" class="select-input">
              <option value="180">소형 (180px)</option>
              <option value="256" selected>표준 (256px)</option>
              <option value="360">대형 (360px)</option>
              <option value="512">초고화질 (512px)</option>
            </select>
          </div>

          <div class="control-item">
            <label for="error-correction">오류 복구 수준</label>
            <select id="error-correction" class="select-input">
              <option value="L">L (7% 복구 - 가벼움)</option>
              <option value="M" selected>M (15% 복구 - 표준)</option>
              <option value="Q">Q (25% 복구 - 높음)</option>
              <option value="H">H (30% 복구 - 최고)</option>
            </select>
          </div>

          <div class="control-item">
            <label for="color-dark">QR 코드 색상</label>
            <div class="color-picker-wrapper">
              <input type="color" id="color-dark" value="#000000">
              <span id="color-dark-val" class="color-hex">#000000</span>
            </div>
          </div>

          <div class="control-item">
            <label for="color-light">배경 색상</label>
            <div class="color-picker-wrapper">
              <input type="color" id="color-light" value="#ffffff">
              <span id="color-light-val" class="color-hex">#ffffff</span>
            </div>
          </div>
        </div>

        <button id="generate-btn" class="btn-primary" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          QR 코드 즉시 새로고침
        </button>
      </section>

      <!-- Preview & Download Section -->
      <section class="glass-panel preview-card" aria-labelledby="preview-heading">
        <h2 id="preview-heading" class="panel-title">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          QR 코드 미리보기
        </h2>

        <!-- QR Canvas Container -->
        <div id="qrcode-wrapper" class="qr-frame">
          <div id="qrcode"></div>
        </div>

        <div class="qr-info">
          <div id="target-url-display" class="qr-url-text" title="https://www.google.com">https://www.google.com</div>
        </div>

        <!-- Download / Share Actions -->
        <div class="download-actions">
          <button id="download-btn" class="btn-secondary" type="button" title="PNG 파일로 저장">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            PNG 다운로드
          </button>

          <button id="copy-btn" class="btn-secondary" type="button" title="클립보드에 이미지 복사">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            이미지 복사
          </button>
        </div>
      </section>
    </main>

    <!-- Footer Note -->
    <footer class="footer-note">
      <p>💡 크롬 및 모든 최신 브라우저에서 서버 없이 단독으로 동작합니다.</p>
    </footer>
  </div>

  <!-- Toast Notification element -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span id="toast-msg">복사되었습니다!</span>
  </div>

  <!-- Local Standalone QRCode Library -->
  <script src="qrcode.min.js"></script>
  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
